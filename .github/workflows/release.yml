# Builds the Windows and Android apps on GitHub's machines and attaches them to a release.
# Runs when a release is published, or by hand (Actions → Release builds → Run workflow).
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to (e.g. v2.3)"
        required: true
      ref:
        description: "Branch or commit to build (default: the tag)"
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Musiplex.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp mutagen zeroconf pyinstaller pillow pywebview pystray
          pyinstaller --onefile --noconsole --name Musiplex --icon Linux/musiplex.png `
            --paths Linux --hidden-import musiplex_server --hidden-import workload_tasks --collect-submodules zeroconf `
            --collect-all webview --hidden-import clr --hidden-import pystray._win32 `
            --add-data "Client/musiplex.html;." --add-data "Linux/musiplex.png;." `
            Windows/musiplex_windows.py
      - name: Build Workload.exe (when the Workload sources are in the repo)
        if: hashFiles('Workload/Windows/workload_windows.py') != ''
        shell: pwsh
        run: |
          $icon = if (Test-Path Workload/Windows/workload.png) { "Workload/Windows/workload.png" } else { "Linux/musiplex.png" }
          pyinstaller --onefile --noconsole --name Workload --icon $icon `
            --collect-all webview --hidden-import clr --hidden-import pystray._win32 `
            --add-data "Workload/Web/workload.html;." --add-data "${icon};." `
            Workload/Windows/workload_windows.py
      - name: Check that the server starts
        shell: pwsh
        run: |
          $p = Start-Process dist/Musiplex.exe -ArgumentList "--serve" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try { if ((Invoke-WebRequest http://127.0.0.1:7860/ping -UseBasicParsing).Content -like "musiplex*") { $ok = $true; break } } catch {}
          }
          $page = 0
          try { $page = (Invoke-WebRequest http://127.0.0.1:7860/app -UseBasicParsing).StatusCode } catch {}
          Get-Content "$env:APPDATA/Musiplex/server.log" -ErrorAction SilentlyContinue
          Stop-Process $p -Force
          Get-Process Musiplex -ErrorAction SilentlyContinue | Stop-Process -Force   # the one-file exe's child too
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "server didn't start" }
          if ($page -ne 200) { throw "app page missing ($page)" }
      - name: Check that the app opens (windows, tray, server)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist/Musiplex.exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          $up = $false
          try { $up = (Invoke-WebRequest http://127.0.0.1:7860/ping -UseBasicParsing).Content -like "musiplex*" } catch {}
          Get-Content "$env:APPDATA/Musiplex/server.log" -ErrorAction SilentlyContinue
          Get-Process Musiplex -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "app still running: $alive, server answering: $up"
          if (-not ($alive -and $up)) { throw "the app didn't stay up" }
      - name: Build the installer (Musiplex and Workload checkboxes)
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('Linux/musiplex.png').save('Installer/Windows/musiplex.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = "$env:TAG".TrimStart("v")
          & $iscc "/DAppVersion=$v" Installer/Windows/Musiplex.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "$env:TAG".TrimStart("v")
          gh release upload "$env:TAG" "dist/Musiplex-$v-Windows-Setup.exe" --clobber -R "${{ github.repository }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          MUSIPLEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musiplex.p12"
            export MUSIPLEX_KEYSTORE="$RUNNER_TEMP/musiplex.p12"
          fi
          gradle -p Android assembleRelease --no-daemon
      - name: Build the Workload APK (when the Workload sources are in the repo)
        if: hashFiles('Workload/Android/settings.gradle', 'Workload/Android/settings.gradle.kts') != ''
        run: gradle -p Workload/Android assembleRelease --no-daemon
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          cp Android/app/build/outputs/apk/release/app-release.apk "Musiplex-$v-Android.apk"
          files="Musiplex-$v-Android.apk"
          w=$(ls Workload/Android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$w" ]; then cp "$w" "Workload-$v-Android.apk"; files="$files Workload-$v-Android.apk"; fi
          gh release upload "$TAG" $files --clobber -R "${{ github.repository }}"
