<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Musiplex</title>
<!--
  Musiplex player: one page for the Android app, the Windows / Linux app window, and the
  Windows mini player (?mode=mini) and notch (?mode=notch). Wide windows get the Mac app's
  layout (sidebar, player bar); narrow ones get the iPhone app's (tabs, mini player that
  expands into Now Playing). Nothing about anyone is built in: the server address, its key
  and this device's ID are made or entered on the device and kept only there.
-->
<style>
:root{--bg:#07070b;--side:#0d0d12;--panel:#121218;--raised:rgba(255,255,255,.07);--hover:rgba(255,255,255,.05);--line:rgba(255,255,255,.08);
--text:#fff;--dim:rgba(255,255,255,.58);--accent:#a38aff;--accent2:#ff6ea3;--grad:linear-gradient(135deg,var(--accent),var(--accent2));--red:#ff453a;--green:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body:not(.desk) *{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--raised);border:0;border-radius:10px;padding:9px 12px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
select{width:auto}select option{background:#1c1c22}
svg{width:1em;height:1em;fill:currentColor;flex:none}
.hidden{display:none!important}.dim{color:var(--dim)}.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px;border:3px solid transparent;background-clip:padding-box}
.art{background:linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.05)) center/cover no-repeat;border-radius:6px;flex:none;position:relative;overflow:hidden}
.art.none::after{content:"♪";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.3);font-size:150%}
.art.round{border-radius:50%}
/* ---------------- shared pieces ---------------- */
.row{display:flex;align-items:center;gap:12px;padding:7px 16px;width:100%;text-align:left;cursor:default}
.row:hover{background:var(--hover)}.row:active{background:var(--raised)}
.row .art{width:48px;height:48px}
.row .t{flex:1;min-width:0}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13.5px;color:var(--dim)}
.row .al,.row .du{display:none;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .title{color:var(--accent)}
.row .wave{display:none;color:var(--accent);margin-right:6px;font-size:10px;letter-spacing:-2px}.row.cur.playing .wave{display:inline}
.row .side{width:32px;height:32px;display:grid;place-items:center;font-size:20px;color:var(--dim)}.row .side.ok{color:var(--accent)}
.ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.15) 0)}
.ring::after{content:"";display:block;margin:3px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:0 16px}
.tile{text-align:left;min-width:0}.tile .art{width:100%;aspect-ratio:1;border-radius:10px;transition:transform .15s}.tile:hover .art{transform:scale(1.02)}
.tile div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .n{font-size:14px;font-weight:600;margin-top:6px}.tile .s{font-size:13px;color:var(--dim)}
.tile.artist{text-align:center}.tile.artist .art{border-radius:50%}
.cards{display:flex;gap:12px;padding:0 16px 12px}
.card{flex:1;min-width:0;min-height:110px;border-radius:16px;background:var(--grad);color:#000;padding:14px;display:flex;flex-direction:column;text-align:left}
.card svg{font-size:22px;margin-bottom:auto}.card b{font-size:17px}.card small{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:10px;padding:0 16px 10px;flex-wrap:wrap}
.btn{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;background:var(--raised);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}.btn.primary{background:var(--accent);color:#000}.btn.small{flex:none;padding:6px 12px;font-size:13px;border-radius:999px}
.btn.red{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pills{display:flex;gap:4px;flex-wrap:wrap}.pills button{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600}
.pills button.on{background:var(--grad);color:#000}
.empty{padding:50px 24px;text-align:center;color:var(--dim)}.empty svg{font-size:40px;display:block;margin:0 auto 10px}
.listhead{padding:4px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.listhead .art{width:min(62vw,240px);height:min(62vw,240px);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.listhead h2{margin:14px 0 2px;font-size:22px}
.back{display:flex;align-items:center;gap:4px;color:var(--accent);padding:12px 12px 4px;font-size:17px}
.hist{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.hist .t{flex:1;min-width:0}.hist b{color:var(--accent);margin-right:6px}.hist .ch{font-size:13.5px;color:var(--dim);margin-top:2px}
.setcard{margin:0 16px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.setcard h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.setcard h3 svg{color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}.kv span:first-child{color:var(--dim)}
.kv code{font:13px ui-monospace,Consolas,monospace;-webkit-user-select:text;user-select:text}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;width:100%;text-align:left;font-size:14px}
.toggle i{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.yes i{background:var(--grad)}.toggle.yes i::after{left:16px}
.note{font-size:12px;color:var(--dim);margin-top:4px}
.ring2{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green)}
/* ---------------- phone layout ---------------- */
#phone{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px}
#phone header{display:flex;align-items:center;gap:8px;padding:14px 16px}
#phone header h1{font-size:34px;margin:0;flex:1;font-weight:800;letter-spacing:-.5px}
.status{display:flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;max-width:52%}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}.status i.on{background:var(--green)}
.gear{width:34px;height:34px;display:grid;place-items:center;font-size:19px;background:var(--raised);border-radius:50%}
.seg{display:flex;margin:0 16px 12px;background:var(--raised);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--dim)}
.seg button.on{background:#636366;color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;margin:0 16px 10px;background:var(--raised);border-radius:10px;padding:0 12px;color:var(--dim)}
.search input{background:none;padding:9px 0}
#mini{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:8px 10px;
background:rgba(40,40,48,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;z-index:5}
#mini .art{width:42px;height:42px}#mini .t{flex:1;min-width:0}#mini .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .n{font-size:15px;font-weight:600}#mini .w{font-size:11px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
#mini button{width:40px;height:40px;display:grid;place-items:center;font-size:22px}
#full{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
#full.open{transform:none}
#full .tint{position:absolute;inset:0;background:linear-gradient(var(--tint,transparent),var(--bg) 85%);opacity:.75;pointer-events:none}
#full .in{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:0 26px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.grab{height:34px;display:grid;place-items:center;width:100%;flex:none}.grab i{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
#bigart{width:100%;aspect-ratio:1;max-width:440px;margin:6px auto 0;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#bigart.paused{transform:scale(.9)}
.np{display:flex;align-items:center;gap:12px;margin-top:24px}.np .t{flex:1;min-width:0}.np .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ftitle{font-size:22px;font-weight:700}#fartist{color:var(--dim)}
.np>button:not(.t){font-size:24px;width:36px;height:36px;display:grid;place-items:center}
.scrub{touch-action:none;padding:8px 0;cursor:pointer}
.scrub .track{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;transition:height .15s}
.scrub.drag .track{height:10px}.scrub i{display:block;height:100%;width:0;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ctl button{width:48px;height:48px;display:grid;place-items:center;font-size:22px}
.ctl .big{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;font-size:30px}
.on{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px;background:rgba(0,0,0,.3);border-radius:999px;margin-top:22px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
.chip.sel{background:var(--grad);color:#000}
.vol{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}.vol input{padding:0;background:none;accent-color:#fff}
.hint{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
/* ---------------- desktop layout (Mac app) ---------------- */
#desk{position:absolute;inset:0;display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr auto}
#sidebar{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px 20px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-size:19px;font-weight:700}
.logo b{width:30px;height:30px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#000;font-size:16px}
#sidebar .search{margin:0 0 10px}
.nav{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--dim);width:100%;text-align:left}
.nav svg{width:18px;height:18px}.nav:hover{background:var(--hover);color:#fff}.nav.sel{background:var(--raised);color:#fff}.nav.sel svg{color:var(--accent)}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.06em;padding:16px 10px 4px}
.sec button{color:var(--dim);font-size:14px}.sec button:hover{color:#fff}
.plrow{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;font-size:14px;width:100%;text-align:left}
.plrow:hover{background:var(--hover)}.plrow.sel{background:var(--raised)}.plrow .art{width:26px;height:26px;border-radius:4px}
.plrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plrow.drop{box-shadow:inset 0 2px 0 var(--accent)}
.fy{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;width:100%;text-align:left}
.fy:hover{background:var(--hover)}.fy.sel{background:var(--raised)}
.fy b{width:26px;height:26px;border-radius:6px;background:var(--grad);display:grid;place-items:center;color:#000;font-size:14px;flex:none}
.fy div{min-width:0}.fy div span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{overflow-y:auto;padding:22px 12px 30px;position:relative}
#main h1{font-size:26px;margin:0 16px 14px;display:flex;align-items:baseline;gap:10px}#main h1 small{font-size:17px;color:var(--dim);font-weight:500}
body.desk .row{padding:6px 16px;border-radius:8px}
body.desk .row .art{width:40px;height:40px}
body.desk .row .al{display:block;width:28%}body.desk .row .du{display:block;width:52px;text-align:right}
body.desk .listhead{flex-direction:row;align-items:flex-end;gap:22px;text-align:left}
body.desk .listhead .art{width:190px;height:190px}body.desk .listhead h2{font-size:30px;margin:6px 0}
body.desk .back{padding:0 16px 10px;font-size:15px}
body.desk .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
#bar{grid-column:1/3;display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,1.4fr) minmax(200px,1fr);align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
#bar .now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}#bar .now .art{width:52px;height:52px}
#bar .now div{min-width:0}#bar .now b,#bar .now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar .now span{color:var(--dim);font-size:13px}
#bar .mid .ctl{margin:0;justify-content:center;gap:14px}#bar .mid .ctl button{width:34px;height:34px;font-size:17px}
#bar .mid .ctl .big{width:38px;height:38px;font-size:16px}
#bar .mid .sc{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}#bar .mid .scrub{flex:1;padding:6px 0}
#bar .mid .scrub .track{height:4px}#bar .mid .scrub.drag .track,#bar .mid .scrub:hover .track{height:6px}#bar .mid .scrub i{background:var(--grad)}
#bar .right{display:flex;align-items:center;justify-content:flex-end;gap:8px}#bar .right .vol{width:120px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:17px;color:var(--dim)}.ib:hover{background:var(--hover);color:#fff}.ib.on{color:var(--accent)}
.spk{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(163,138,255,.15);color:var(--accent);font-size:12px;font-weight:600;max-width:170px}
.spk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer{position:absolute;right:0;top:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--line);z-index:6;overflow-y:auto;transform:translateX(100%);transition:transform .25s}
#drawer.open{transform:none}#drawer h3{margin:16px;font-size:17px}
/* ---------------- sheets & menus ---------------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:620px;max-height:88%;overflow-y:auto;background:#1c1c22;border-radius:14px 14px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
body.desk .sheet{align-items:center}body.desk .sheet .box{border-radius:14px;max-height:80%}
.sheet.open .box{transform:none}
.sheet h3{margin:8px 16px 12px;font-size:19px;display:flex;align-items:center;gap:8px}.sheet h3 .x{margin-left:auto;font-size:15px;color:var(--dim)}
.sheet .pad{padding:0 16px;display:grid;gap:10px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 18px;font-size:15.5px;text-align:left}
.menu button:hover{background:var(--hover)}.menu button svg{font-size:19px;color:var(--dim)}.menu .red,.menu .red svg{color:var(--red)}
#pop{position:fixed;z-index:30;min-width:220px;max-width:320px;max-height:70vh;overflow-y:auto;background:#24242c;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;font-size:13.5px;text-align:left}
#pop button:hover{background:var(--accent);color:#000}#pop button svg{font-size:15px}#pop .red{color:var(--red)}#pop .h{font-size:11px;color:var(--dim);padding:6px 10px 2px;font-weight:600}
#pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.found{display:grid;gap:8px}.found button{display:flex;justify-content:space-between;align-items:center;background:var(--raised);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(50,50,58,.96);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* ---------------- mini player window ---------------- */
body.m{background:#121218}
#minip{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 14px}
#minip .top{display:flex;gap:12px;align-items:center}#minip .top .art{width:64px;height:64px;border-radius:10px}
#minip .top .t{flex:1;min-width:0}#minip .top .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minip .ctl{margin-top:6px}#minip .ctl button{width:36px;height:36px;font-size:17px}#minip .ctl .big{width:42px;height:42px;font-size:18px}
#minip .q{flex:1;overflow-y:auto;margin:8px -14px 0;border-top:1px solid var(--line)}
/* ---------------- notch window ---------------- */
body.n{background:transparent}
#notch{position:absolute;inset:0;background:#000;border-radius:0 0 16px 16px;overflow:hidden;display:flex;flex-direction:column}
#notch .pill{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;flex:none}
#notch .pill .art{width:20px;height:20px;border-radius:5px}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}.bars i{width:3px;background:var(--grad);border-radius:1px;animation:b 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes b{0%,100%{height:3px}50%{height:12px}}.bars.stop i{animation:none;height:3px}
#notch .tabs{display:flex;align-items:center;gap:2px;padding:4px 10px 0}
#notch .tabs button{width:34px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:15px}
#notch .tabs button:hover{color:#fff;background:var(--hover)}#notch .tabs button.sel{color:#fff;background:var(--raised)}
#notch .body{flex:1;padding:10px 18px 14px;overflow:hidden;display:flex}
#notch .body>div{flex:1;min-width:0;overflow-y:auto}
#notch .mus{display:flex;gap:18px;align-items:center}#notch .mus .art{width:120px;height:120px;border-radius:12px}
#notch .mus .ctl{margin-top:4px;justify-content:flex-start;gap:16px}#notch .mus .ctl button{width:28px;height:28px;font-size:15px}
#notch .mus .ctl .big{width:36px;height:36px;font-size:15px}
.drop{border:1.5px dashed rgba(255,255,255,.25);border-radius:12px;padding:14px;text-align:center;color:var(--dim);font-size:13px}
.drop.over{border-color:var(--accent);color:#fff;background:rgba(163,138,255,.1)}
.fileitem{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px}.fileitem span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip:hover{background:var(--raised)}
</style></head>

<script>
"use strict";
// ======================================================================= basics
const $ = id => document.getElementById(id);
const bridge = window.Android || null;
const Q = new URLSearchParams(location.search);
const MODE = Q.get("mode") || "full";                       // full | mini | notch
const ANDROID = !!bridge;
const SERVED = /^https?:$/.test(location.protocol) && location.pathname.startsWith("/app");
let api = null;                                              // Windows app (pywebview) helpers
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icon = n => `<svg><use href="#i-${n}"/></svg>`;
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2400); }
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const wide = () => MODE === "full" && !ANDROID && innerWidth >= 820;

// ======================================================================= identity & connection
const OFF = Q.has("offset") ? (parseInt(Q.get("offset"), 10) || 0) : (SERVED && location.port ? (parseInt(location.port, 10) - 7860) : 0);
const HTTP = 7860 + OFF, WS = 7861 + OFF;
const PANEL = MODE !== "full";
const idKey = PANEL ? `deviceID-${MODE}` : "deviceID";
let deviceID = store.get(idKey, null);
if (!deviceID) { deviceID = (ANDROID ? "android-" : PANEL ? `panel-${MODE}-` : "pc-") + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(16).slice(2)); store.set(idKey, deviceID); }
const KIND = ANDROID ? "android" : PANEL ? "panel" : "pc";
let local = null;            // set when this window is on the server's own computer (/local/token)
let deviceName = ANDROID ? bridge.deviceName() : "This computer";
const myWord = ANDROID ? "phone" : "computer";

let host = store.get("host", "");
let tokens = store.get("tokens", {});
let alts = store.get("alts", {});
let ws = null, wsHost = "", authed = false, retry = null, wantPin = false, serverName = store.get("serverName", "");
let catalog = store.get("catalog", { tracks: [], albums: [], playlists: [], history: [] });
let byId = {};
let state = null, stateAt = 0, devices = [], noSpeaker = false;
let downloads = {};
const progress = {};
const linked = () => authed;
let settings = Object.assign({ hideDupes: true, notchIdle: true, notchBattery: true }, store.get("settings", {}));
const saveSettings = () => store.set("settings", settings);

function indexCatalog() { byId = {}; (catalog.tracks || []).forEach(t => byId[t.id] = t); }
indexCatalog();
function loadDownloads() { downloads = {}; if (!bridge) return; try { JSON.parse(bridge.downloads()).forEach(d => downloads[d.id] = d); } catch {} }
loadDownloads();

const found = new Map();
window.onFound = (name, hh) => {
  if (found.has(hh)) return;
  found.set(hh, name.replace(/\\032/g, " "));
  if ($("found")) drawFound();
  if (!host) start(hh);
};

function start(hh, pin) {
  stop();
  if (hh !== host) { host = hh; if (!local) store.set("host", hh); }
  setMsg("Connecting…");
  open([hh, ...(alts[hh] || [])], 0, pin);
  drawStatus();
}
function stop() {
  clearTimeout(retry); retry = null;
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} ws = null; }
  authed = false; drawStatus();
}
function open(list, i, pin) {
  const hh = list[i % list.length];
  let sock;
  try { sock = new WebSocket(`ws://${hh}:${WS}/`); } catch { return later(list, i + 1, pin); }
  ws = sock; wsHost = hh;
  const giveUp = setTimeout(() => { if (!authed) try { sock.close(); } catch {} }, 5000);
  sock.onopen = () => {
    const hello = { type: "hello", name: deviceName, deviceID, kind: KIND };
    if (tokens[host]) hello.token = tokens[host];
    if (pin) hello.pin = pin;
    sock.send(JSON.stringify(hello));
  };
  sock.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } handle(m); };
  sock.onclose = () => {
    clearTimeout(giveUp);
    if (ws !== sock) return;
    const was = authed; authed = false; drawStatus(); if (was) drawPlayer();
    if (wantPin) return;
    if (!was) setMsg("Can't reach it. Check the address and that the server is running.");
    later(list, i + 1, pin);
  };
}
function later(list, i, pin) { clearTimeout(retry); retry = setTimeout(() => open(list, i, pin), 2500); }
function send(m) { if (ws && authed && ws.readyState === 1) { ws.send(JSON.stringify(m)); return true; } return false; }
let seq = Date.now() % 1000000;
function command(action, extra) {
  const c = Object.assign({ action }, extra || {});
  if (!linked()) return offline.perform(c);
  send({ type: "command", command: c, seq: ++seq });
}
const pendingRemote = [];
function handle(m) {
  switch (m.type) {
    case "welcome":
      authed = true; wantPin = false; offline.stop();
      tokens[host] = m.token; if (!local) store.set("tokens", tokens);
      if (m.hosts && m.hosts.length && !local) { alts[host] = m.hosts.filter(x => x !== host); store.set("alts", alts); }
      serverName = m.name || host; store.set("serverName", serverName);
      noSpeaker = !!m.noSpeaker || /\((Linux|Windows)\)$/.test(serverName);
      devices = m.devices || [];
      setState(m.state); drawStatus(); loadCatalog();
      closeSheet("link"); setMsg("");
      while (pendingRemote.length) window.remote(...pendingRemote.shift());
      break;
    case "denied": {
      delete tokens[host]; store.set("tokens", tokens);
      const tried = !!($("pin") && $("pin").value);
      wantPin = true; stop();
      openLink(tried ? "That PIN didn't work. It's in Settings on the Mac, or in the Musiplex window's Settings on Windows and Linux." : "Enter the 6‑digit PIN shown on the server. You only need it once.");
      break;
    }
    case "state": case "promoted": if (m.state) setState(m.state); break;
    case "tick":
      if (state) { state.position = m.position || 0; state.isPlaying = !!m.isPlaying; stateAt = Date.now(); syncAudio(); }
      break;
    case "devices": devices = m.devices || []; drawPlayer(); break;
    case "library": loadCatalog(); break;
  }
}

// ======================================================================= server data
const pending = {};
window.onFetched = (id, status, text) => { const f = pending[id]; delete pending[id]; f && f(status, text); };
function get(url, done, dataURL) {
  if (bridge) { const id = String(Math.random()); pending[id] = done; dataURL ? bridge.getDataURL(id, url) : bridge.get(id, url); return; }
  fetch(url).then(r => (dataURL ? r.blob().then(b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); })) : r.text()).then(t => done(r.status, t))).catch(() => done(0, ""));
}
const base = () => `http://${wsHost}:${HTTP}`;
const tok = () => encodeURIComponent(tokens[host] || "");
const artURL = id => linked() && id ? `${base()}/art/${id}?t=${tok()}` : "";
function setArt(el, id) {
  if (!el) return;
  const u = artURL(id);
  el.classList.toggle("none", !u);
  el.style.backgroundImage = u ? `url("${u}"), linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.05))` : "";
}
function loadCatalog() {
  get(`${base()}/catalog?t=${tok()}`, (status, text) => {
    if (status !== 200) return;
    let c; try { c = JSON.parse(text); } catch { return; }
    catalog = c; indexCatalog();
    if (!PANEL) store.set("catalog", { tracks: c.tracks, albums: c.albums, playlists: c.playlists, history: (c.history || []).slice(0, 50) });
    render(); drawPlayer(); drawSidebar();
  });
}
// The server's own computer: local-only extras (folders, taste, discover, file box…)
const L = {
  get: p => fetch(p, { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
  post: (p, body) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json", "X-Musiplex": "1" }, body: JSON.stringify(body || {}) }).then(r => r.json()),
};
function openURL(u) { if (api && api.open_url) api.open_url(u); else if (bridge && bridge.openUrl) bridge.openUrl(u); else window.open(u, "_blank"); }

// ======================================================================= library helpers
const isAuto = p => (p.subtitle || "").startsWith("auto");
const myLists = () => (catalog.playlists || []).filter(p => !isAuto(p));
const playable = id => linked() || !!downloads[id];
function dedupe(tracks) {
  if (!settings.hideDupes) return tracks;
  const seen = new Map(), out = [];
  const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
  for (const t of tracks) {
    const k = norm(t.title) + "|" + norm(t.artist), prev = seen.get(k);
    if (prev && Math.abs((prev.duration || 0) - (t.duration || 0)) < 3) continue;
    seen.set(k, t); out.push(t);
  }
  return out;
}
const songs = () => dedupe((catalog.tracks || []).slice().sort((a, b) => a.title.localeCompare(b.title)));
function artists() {
  const m = new Map();
  for (const t of catalog.tracks || []) { const a = m.get(t.artist) || { name: t.artist, ids: [] }; a.ids.push(t.id); m.set(t.artist, a); }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
}
const matches = q => t => !q || `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q);

// ======================================================================= downloads (Android)
const dlQueue = []; let dlBusy = 0;
function download(t) {
  if (!t || downloads[t.id] || progress[t.id] !== undefined || !bridge || !linked()) return;
  progress[t.id] = 0; dlQueue.push(t); pump(); refreshRow(t.id);
}
function pump() {
  while (dlBusy < 4 && dlQueue.length) {
    const t = dlQueue.shift(); dlBusy++;
    bridge.download(t.id, t.ext || "m4a", `${base()}/file/${t.id}.${t.ext || "m4a"}?t=${tok()}`);
  }
}
window.onDownload = (id, f) => {
  if (f >= 1 || f < 0) { delete progress[id]; dlBusy = Math.max(0, dlBusy - 1); pump(); if (f >= 1) loadDownloads(); else toast("A download didn't finish."); }
  else progress[id] = f;
  refreshRow(id); if (id === cur()) drawPlayer();
};

  const cards = h(`<div class="cards"><button class="card">${icon("sparkles")}<b>Surprise</b><small>Picks as it plays</small></button>${guess ? `<button class="card">${icon("wand")}<b>Guess</b><small>${esc(moment(guess))}</small></button>` : ""}</div>`);
  cards.children[0].onclick = () => { if (!linked() && !Object.keys(downloads).length) return toast("Connect to your server first."); command("surprise"); if (!wide()) setTimeout(() => expand(true), 300); };
  if (guess) cards.children[1].onclick = () => go({ v: "list", id: "auto-guess", kind: "Guess" }, true);
  c.appendChild(cards);
}
const moment = g => (g.subtitle || "").replace("auto · ", "").replace("auto", "").replace(/^./, s => s.toUpperCase()) || "For right now";
function viewHome(c) {
  const hr = new Date().getHours();
  c.appendChild(h(`<h1>${hr < 5 ? "Good night" : hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening"}</h1>`));
  forYouCards(c);
  const recent = (catalog.tracks || []).slice().sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  const albums = []; const seen = new Set();
  for (const t of recent) { const a = (catalog.albums || []).find(x => x.trackIDs.includes(t.id)); if (a && !seen.has(a.id)) { seen.add(a.id); albums.push(a); } if (albums.length >= 12) break; }
  if (albums.length) {
    c.appendChild(h(`<div class="sec" style="padding:14px 16px 8px">RECENTLY ADDED</div>`));
    const g = h(`<div class="grid"></div>`); albums.forEach(a => g.appendChild(tile(a.name, a.subtitle, a.trackIDs[0], () => go({ v: "list", id: a.id, kind: "Album" }, true)))); c.appendChild(g);
  }
  const lists = myLists();
  if (lists.length) {
    c.appendChild(h(`<div class="sec" style="padding:22px 16px 8px">YOUR PLAYLISTS</div>`));
    const g = h(`<div class="grid"></div>`); lists.slice(0, 12).forEach(p => g.appendChild(tile(p.name, `${p.trackIDs.length} songs`, p.trackIDs[0], () => go({ v: "list", id: p.id, kind: "Playlist" }, true), false, (x, y) => listMenu(p, x, y)))); c.appendChild(g);
  }
  if (!(catalog.tracks || []).length) empty(c, "note", linked() ? "No songs yet. Add a music folder in Settings, or put songs in Documents › Songs." : "Connecting to your music…");
}

function viewPlaylists(c) {
  forYouCards(c);

    b.onclick = () => go({ v: "list", id: p.id, kind: "Playlist" }, true);
    let press; b.addEventListener("touchstart", e => { const t = e.touches[0]; press = setTimeout(() => listMenu(p, t.clientX, t.clientY), 480); }, { passive: true });
    ["touchend", "touchmove"].forEach(ev => b.addEventListener(ev, () => clearTimeout(press), { passive: true }));

function rearrange() {
  let order = myLists().map(p => p.id);
  const box = sheet("rearrange", `<h3>Rearrange playlists <button class="x" data-close>Done</button></h3><div id="rl"></div><div class="note" style="padding:8px 16px">Saved on your server and used on every device.</div>`);
  const draw = () => {
    const l = box.querySelector("#rl"); l.innerHTML = "";
    order.forEach((id, i) => {
      const p = myLists().find(x => x.id === id); if (!p) return;
      const r = h(`<div class="row"><div class="t"><div>${esc(p.name)}</div></div><button class="ib">▲</button><button class="ib">▼</button></div>`);
      r.children[1].onclick = () => { if (i > 0) { [order[i - 1], order[i]] = [order[i], order[i - 1]]; send({ type: "reorderPlaylists", ids: order }); draw(); } };
      r.children[2].onclick = () => { if (i < order.length - 1) { [order[i + 1], order[i]] = [order[i], order[i + 1]]; send({ type: "reorderPlaylists", ids: order }); draw(); } };
      l.appendChild(r);
    });
  };
  draw();
}
function viewOffline(c, q) {
  const count = Object.keys(downloads).length;
  const ids = songs().filter(t => downloads[t.id]).filter(matches(q)).map(t => t.id);
  const total = Object.values(downloads).reduce((a, d) => a + (d.size || 0), 0);
  if (count) {
    const bar = h(`<div class="btns" style="align-items:center"><span class="dim" style="flex:1;font-size:13px">${count} songs · ${(total / 1e6).toFixed(0)} MB on this phone</span>${linked() ? `<button class="pill" style="background:rgba(163,138,255,.18);color:var(--accent)" id="syncall">${icon("sync")} Sync</button>` : ""}<button class="pill" style="background:rgba(255,69,58,.15);color:var(--red)" id="delall">${icon("trash")} Delete All</button></div>`);
    c.appendChild(bar);
    if ($("syncall")) $("syncall").onclick = syncAll;
    $("delall").onclick = () => { if (confirm(`Delete all ${count} downloaded songs from this phone? They stay on your server.`)) { Object.keys(downloads).forEach(id => bridge.removeDownload(id)); loadDownloads(); render(); } };
  } else if (linked() && bridge) {
    const bar = h(`<div class="btns"><button class="btn primary">${icon("down")} Download every song</button></div>`); bar.firstChild.onclick = syncAll; c.appendChild(bar);
  }
  if (!ids.length) return empty(c, "down", count ? "No downloads match." : "Songs you download play here with no connection.");
  rows(c, ids);
}
function viewHistory(c) {
  title(c, "Playlist History");
  const hist = catalog.history || [];
  if (!hist.length) return empty(c, "clock", "Every playlist change gets a version here, with the device it came from.");
  hist.forEach(v => {
    const secs = v.date < 1e9 ? v.date + 978307200 : v.date;
    const when = new Date(secs * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const lines = (v.changes || []).map(ch => {
      const n = (ch.songs || []).length;
      const what = { added: `Added ${n} song${n === 1 ? "" : "s"} to`, removed: `Removed ${n} song${n === 1 ? "" : "s"} from`, created: "Created", deleted: "Deleted", renamed: "Renamed" }[ch.kind] || ch.kind;
      return `<div class="ch">${esc(what)} “${esc(ch.playlist)}”${n && n <= 3 ? ": " + esc(ch.songs.join(", ")) : ""}</div>`;
    }).join("");
    const d = h(`<div class="hist"><div class="t"><div><b>1.${v.number}</b><span class="dim" style="font-size:13px">${esc(when)} · ${esc(v.source || "")}</span></div>${lines}</div>${linked() ? `<button class="btn small">Revert</button>` : ""}</div>`);
    const rb = d.querySelector("button");
    if (rb) rb.onclick = () => { if (confirm(`Undo version 1.${v.number}? This makes a new version, so you can undo the undo.`)) send({ type: "revert", text: String(v.number) }); };
    c.appendChild(d);
  });
}

function viewList(c) {
  let p, kind = route.kind;
  if (kind === "Album") p = (catalog.albums || []).find(a => a.id === route.id);
  else if (kind === "Artist") { const a = artists().find(x => x.name === route.id); p = a && { id: a.name, name: a.name, subtitle: "Artist", trackIDs: a.ids }; }
  else p = (catalog.playlists || []).find(x => x.id === route.id);
  if (!p) return empty(c, "list", "This list is gone.");
  if (stack.length || !wide()) backButton(c, stack.length ? "Back" : "Playlists");
  const ids = dedupe(p.trackIDs.map(i => byId[i]).filter(Boolean)).map(t => t.id);

  setArt(head.querySelector(".art"), ids[0]);

  const b = h(`<div class="btns"><button class="btn primary">${icon("play")} Play</button><button class="btn">${icon("shuffle")} Shuffle</button>${editable ? `<button class="btn" style="flex:none">${icon("pen")}</button>` : ""}</div>`);
  b.children[0].onclick = () => ids.length && playList(ids, 0);
  b.children[1].onclick = () => shuffleList(ids);
  if (editable) b.children[2].onclick = e => listMenu(p, e.clientX, e.clientY);
  c.appendChild(b);
  if (!ids.length) return empty(c, "list", editable ? "Add songs with + or by dragging them onto the playlist in the sidebar." : "No songs here yet.");

async function importFolder() {
  let path = null;
  if (api && api.pick_folder) path = await api.pick_folder();

  if (!path) return;
  L.post("/local/folders", { add: path }).then(r => { if (r.error) toast(r.error); else { toast(`Added · ${r.songs} songs`); render(); } });
}

// ======================================================================= Discover (new songs per genre)
function discover(genre) {
  const box = sheet("discover", `<h3>${icon("sparkles")} New ${esc(genre)} songs <button class="x" data-close>Close</button></h3><div class="pad"><div class="note">Not in your library. Tap ▶ for a 30‑second preview. To put them in Spotify, export the list and import it with TuneMyMusic or Soundiiz (free).</div><div class="btns" style="padding:0"><button class="btn small" id="dcsv">${icon("down")} Export CSV</button><button class="btn small" id="dcopy">${icon("copy")} Copy List</button><button class="btn small" id="dtmm">${icon("link")} TuneMyMusic</button><button class="btn small" id="dsz">${icon("link")} Soundiiz</button></div></div><div id="dlist"><div class="empty">Looking…</div></div>`);
  let songsFound = [];
  L.get(`/local/discover?genre=${encodeURIComponent(genre)}`).then(list => {
    songsFound = list; const l = box.querySelector("#dlist"); l.innerHTML = "";
    if (!list.length) return empty(l, "search", "Nothing new found right now.");
    list.forEach(s => {
      const r = h(`<div class="row"><div class="art"></div><div class="t"><div>${esc(s.title)}</div><div class="sub">${esc(s.artist)}${s.album ? " · " + esc(s.album) : ""}</div></div>${s.preview ? `<button class="ib">${icon("play")}</button>` : ""}${s.url ? `<button class="ib">${icon("link")}</button>` : ""}</div>`);
      const a = r.querySelector(".art"); if (s.art) a.style.backgroundImage = `url("${s.art}")`; else a.classList.add("none");
      const bs = r.querySelectorAll("button");

let sinkLabel = "";
(async () => { if (sinkId) { const o = (await outputs()).find(x => x.deviceId === sinkId); sinkLabel = o ? o.label : ""; } })();
let scrubbing = null;
function tick() {
  const t = byId[cur()], d = t ? t.duration : 0;
  const p = scrubbing ?? Math.min(position(), d || Infinity);
  document.querySelectorAll(".np-pos").forEach(e => e.textContent = fmt(p));
  document.querySelectorAll(".np-dur").forEach(e => e.textContent = "-" + fmt(Math.max(0, d - p)));
  document.querySelectorAll(".np-fill").forEach(e => e.style.width = d ? `${(p / d) * 100}%` : "0");
}
setInterval(tick, 500);
function wireScrub(el) {
  const at = x => { const t = byId[cur()]; if (!t) return null; const r = el.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * t.duration; };
  el.addEventListener("pointerdown", e => { scrubbing = at(e.clientX); if (scrubbing === null) return; el.classList.add("drag"); el.setPointerCapture(e.pointerId); tick(); });
  el.addEventListener("pointermove", e => { if (scrubbing !== null) { scrubbing = at(e.clientX); tick(); } });
  el.addEventListener("pointerup", () => { if (scrubbing === null) return; const v = scrubbing; scrubbing = null; el.classList.remove("drag"); if (here()) P().currentTime = v; command("seek", { value: v }); });
}
function wireControls(root) {
  root.querySelectorAll(".np-toggle").forEach(b => b.onclick = e => { e.stopPropagation(); window.remote("toggle"); });
  root.querySelectorAll(".np-next").forEach(b => b.onclick = e => { e.stopPropagation(); command("next"); });

  root.querySelectorAll(".np-vol").forEach(b => b.oninput = e => { if (here()) P().volume = +e.target.value; command("volume", { value: +e.target.value }); });
  root.querySelectorAll(".scrub").forEach(wireScrub);
  root.querySelectorAll(".spk").forEach(b => b.onclick = e => { e.stopPropagation(); const r = b.getBoundingClientRect(); speakerMenu(r.left, r.top - 8 - 240); });
}
const controlsHTML = big => `<div class="ctl"><button class="np-shuffle" style="font-size:${big ? 20 : 15}px">${icon("shuffle")}</button><button class="np-prev" style="font-size:${big ? 28 : 18}px">${icon("prev")}</button><button class="np-toggle big">${icon("play")}</button><button class="np-next" style="font-size:${big ? 28 : 18}px">${icon("next")}</button><button class="np-repeat" style="font-size:${big ? 20 : 15}px">${icon("repeat")}</button></div>`;

// artwork colour for the Now Playing background (like the iPhone)
let tinted = "";
function tint(id) {
  if (!id || id === tinted || !linked() || !$("full")) return;
  tinted = id;
  get(artURL(id), (status, data) => {
    if (status !== 200 || tinted !== id) return;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = cv.height = 8;
      const g = cv.getContext("2d"); g.drawImage(img, 0, 0, 8, 8);
      let px; try { px = g.getImageData(0, 0, 8, 8).data; } catch { return; }
      let r = 0, gg = 0, b = 0; for (let i = 0; i < px.length; i += 4) { r += px[i]; gg += px[i + 1]; b += px[i + 2]; }
      const n = px.length / 4; $("full").style.setProperty("--tint", `rgb(${r / n | 0},${gg / n | 0},${b / n | 0})`);
    };
    img.src = data;
  }, true);
}

  if (open === notchOpen) return;
  notchOpen = open;
  $("ntabs").classList.toggle("hidden", !open); $("nbody").classList.toggle("hidden", !open);
  if (api) api.notch(open, idleHidden());
  if (open) drawNotch();
}
const idleHidden = () => settings.notchIdle && !(state && cur() && state.isPlaying);
let battery = null;
function drawNotchPill() {
  const playing = !!(state && state.isPlaying && cur());
  $("nbars") && $("nbars").classList.toggle("stop", !playing);
  if (api && !notchOpen) api.notch(false, idleHidden());
  if (settings.notchBattery) fetch("/local/battery").then(r => r.json()).then(b => { battery = b; $("nbat").textContent = b.percent != null ? `${b.charging ? "⚡" : ""}${b.percent}%` : ""; }).catch(() => {});
  else $("nbat").textContent = "";
}
function drawNotchMusic() {
  drawNotchPill();
  const pill = document.querySelector("#npill .np-art"); if (pill) setArt(pill, cur());
  if (notchOpen && notchTab === "music") drawNotch();
}
let notchDrawnFor = "";
function drawNotch() {
  if (!$("npane")) return;
  $("ntabs").querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.t === notchTab));
  const p = $("npane");
  if (notchTab === "music") {
    const id = cur(), t = id && byId[id];
    const key = `${id}|${state && state.isPlaying}|${state && state.shuffle}|${state && state.repeatMode}|${state && state.activeDevice}|${devices.length}`;
    if (notchDrawnFor !== key || !p.querySelector(".mus,.empty")) {
      notchDrawnFor = key;
      if (!t) { p.innerHTML = `<div class="empty" style="padding:30px">${icon("note")}Nothing is playing</div>`; return; }
      p.innerHTML = `<div class="mus"><div class="art np-art"></div><div style="flex:1;min-width:0"><div class="np-title" style="font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div class="np-artist dim" style="font-size:13px"></div>
        <div class="scrub" style="padding:6px 0"><div class="track" style="height:4px"><i class="np-fill" style="background:var(--grad)"></i></div></div><div class="times"><span class="np-pos"></span><span class="np-dur"></span></div>
        <div style="display:flex;align-items:center;gap:10px">${controlsHTML(false).replace('class="ctl"', 'class="ctl" style="flex:1"')}<button class="spk">${icon("hifi")}<span></span></button></div></div></div>`;
      wireControls(p);
      ["np-title", "np-artist", "np-art", "np-toggle", "np-shuffle", "np-repeat", "spk"].forEach(() => {});
      const save = notchDrawnFor; notchDrawnFor = ""; drawPlayerParts(p); notchDrawnFor = save;
    } else drawPlayerParts(p);
    return;
  }
  notchDrawnFor = "";
  if (notchTab === "files") {
    p.innerHTML = `<div style="display:flex;gap:14px;height:100%"><div class="drop" id="fdrop" style="flex:1;display:grid;place-items:center">${icon("box")}<div>Drop files here to keep them<br><span style="font-size:11px">Music files go to Floating</span></div></div><div style="flex:1.3;min-width:0;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">File Box</b><button class="btn small" id="fopen">${icon("folder")} Open</button></div><div id="flist" style="overflow-y:auto;flex:1"></div></div></div>`;
    const drop = $("fdrop");
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = async e => {
      e.preventDefault(); drop.classList.remove("over");
      const fd = new FormData(); [...e.dataTransfer.files].forEach(f => fd.append("file", f, f.name));
      if (![...fd.keys()].length) return;
      const r = await fetch("/local/filebox", { method: "POST", headers: { "X-Musiplex": "1" }, body: fd }).then(r => r.json()).catch(() => null);
      toast(r ? `Kept ${r.saved.length} file${r.saved.length === 1 ? "" : "s"}` : "Couldn't keep that"); drawFiles();
    };
    $("fopen").onclick = () => L.post("/local/open", { what: "filebox" });
    drawFiles();
  } else if (notchTab === "clipboard") {
    p.innerHTML = `<b style="font-size:13px">Clipboard</b> <span class="dim" style="font-size:11px">· click to copy again</span><div id="clips" style="margin-top:6px"></div>`;
    const drawC = () => (api ? api.clipboard() : Promise.resolve([])).then(items => {
      const l = $("clips"); if (!l) return; l.innerHTML = "";
      if (!items.length) return l.appendChild(h(`<div class="note">Text you copy shows up here (kept only while Musiplex runs).</div>`));
      items.forEach(t => { const b = h(`<button class="clip"></button>`); b.textContent = t.replace(/\s+/g, " ").slice(0, 200); b.title = t.slice(0, 500); b.onclick = () => { api.copy(t); toast("Copied"); }; l.appendChild(b); });
    });
    drawC();
  } else if (notchTab === "notes") {
    p.innerHTML = `<textarea id="nnote" style="width:100%;height:100%;resize:none;background:rgba(255,255,255,.06)" placeholder="Notes… (saved as you type)"></textarea>`;
    const ta = $("nnote"); ta.value = store.get("notes", ""); ta.oninput = () => store.set("notes", ta.value);
  } else if (notchTab === "money") {
    const cur3 = ["USD", "EUR", "GBP", "EGP", "SAR", "AED", "CAD", "AUD", "JPY", "CNY", "INR", "TRY", "CHF", "KWD", "QAR", "MXN", "BRL", "KRW"];
    const m = store.get("money", { amount: "100", from: "USD", to: "EUR" });
    p.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><input id="mamt" style="width:130px" inputmode="decimal"><select id="mfrom">${cur3.map(c => `<option>${c}</option>`).join("")}</select><button class="ib" id="mswap">⇄</button><select id="mto">${cur3.map(c => `<option>${c}</option>`).join("")}</select></div><div id="mres" class="grad" style="font-size:34px;font-weight:800;margin-top:10px"></div><div id="mnote" class="note"></div>`;
    $("mamt").value = m.amount; $("mfrom").value = m.from; $("mto").value = m.to;
    const calc = () => {
      const st = { amount: $("mamt").value, from: $("mfrom").value, to: $("mto").value }; store.set("money", st);
      const cache = store.get("rates", {}), c = cache[st.from];
      const show = rates => { const v = parseFloat(st.amount.replace(",", ".")); if (!rates || !rates.rates[st.to] || isNaN(v)) { $("mres").textContent = ""; return; } $("mres").textContent = new Intl.NumberFormat(undefined, { style: "currency", currency: st.to }).format(v * rates.rates[st.to]); $("mnote").textContent = `Rates from ${new Date(rates.at).toLocaleString()} · open.er-api.com`; };
      if (c && Date.now() - c.at < 6 * 3600e3) return show(c);
      $("mnote").textContent = "Getting exchange rates…";
      fetch(`https://open.er-api.com/v6/latest/${st.from}`).then(r => r.json()).then(j => { const v = { rates: j.rates, at: Date.now() }; cache[st.from] = v; store.set("rates", cache); show(v); }).catch(() => { $("mnote").textContent = "Couldn't get exchange rates — check your connection."; });
    };
    ["mamt", "mfrom", "mto"].forEach(i => $(i).oninput = calc);
    $("mswap").onclick = () => { const a = $("mfrom").value; $("mfrom").value = $("mto").value; $("mto").value = a; calc(); };
    calc();
  } else if (notchTab === "settings") {
    p.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px" id="nset"></div>`;
    const s = $("nset");
    s.appendChild(toggleRow("Hide when nothing is playing", settings.notchIdle, v => { settings.notchIdle = v; saveSettings(); }));
    s.appendChild(toggleRow("Show battery", settings.notchBattery, v => { settings.notchBattery = v; saveSettings(); drawNotchPill(); }));
    s.appendChild(toggleRow("Show the notch", true, v => { if (!v && api) api.set_pref("notch", false); }));
    const cf = h(`<div><div class="note" style="margin:6px 0 4px">CROSSFADE</div></div>`); crossfadePills(cf); s.appendChild(cf);
  } else if (notchTab === "power") {
    p.innerHTML = `<div id="pw" class="empty" style="padding:20px">…</div>`;
    fetch("/local/battery").then(r => r.json()).then(b => {
      $("pw").outerHTML = b.percent == null ? `<div class="empty" style="padding:24px">${icon("bolt")}No battery — this computer runs on mains power.</div>`
        : `<div style="display:flex;align-items:center;gap:24px;padding:10px 6px"><div style="font-size:52px;font-weight:800" class="grad">${b.percent}%</div><div><div style="font-size:16px;font-weight:600">${b.charging ? "Charging" : b.plugged ? "Plugged in" : "On battery"}</div><div class="note">${b.plugged ? "Power adapter connected" : "Unplugged"}</div></div></div><div class="track" style="height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 6px 0"><i style="display:block;height:100%;width:${b.percent}%;background:var(--grad)"></i></div>`;
    }).catch(() => {});
  }
}
function drawFiles() {
  L.get("/local/filebox").then(r => {
    const l = $("flist"); if (!l) return; l.innerHTML = "";
    if (!r.files.length) return l.appendChild(h(`<div class="note">Empty.</div>`));
    r.files.slice(0, 50).forEach(f => { const row = h(`<div class="fileitem">${icon("box")}<span></span><span class="dim" style="flex:none">${(f.size / 1e6).toFixed(1)} MB</span><button class="ib">${icon("trash")}</button></div>`); row.children[1].textContent = f.name; row.querySelector("button").onclick = () => fetch(`/local/filebox?name=${encodeURIComponent(f.name)}`, { method: "DELETE", headers: { "X-Musiplex": "1" } }).then(drawFiles); l.appendChild(row); });
  }).catch(() => {});
}
function drawPlayerParts(root) {
  const id = cur(), t = id && byId[id], playing = !!(state && state.isPlaying);
  const audible = state && state.activeDevice;
  root.querySelectorAll(".np-title").forEach(e => e.textContent = t ? t.title : "");
  root.querySelectorAll(".np-artist").forEach(e => e.textContent = t ? t.artist : "");
  root.querySelectorAll(".np-art").forEach(e => setArt(e, id));
  root.querySelectorAll(".np-toggle").forEach(e => e.innerHTML = icon(playing ? "pause" : "play"));
  root.querySelectorAll(".np-shuffle").forEach(e => e.classList.toggle("on", !!(state && state.shuffle)));
  root.querySelectorAll(".np-repeat").forEach(e => e.classList.toggle("on", !!(state && state.repeatMode !== "off")));
  root.querySelectorAll(".spk span").forEach(e => e.textContent = linked() ? nameOf(audible).replace(/^this computer$/, "Computer") : "…");
  tick();
}

// ======================================================================= start
function build() {
  if (MODE === "mini") buildMini();
  else if (MODE === "notch") buildNotch();
  else if (wide()) buildDesk();
  else buildPhone();
  render(); drawPlayer(); drawStatus();
}
let wasWide = wide();
addEventListener("resize", () => { if (wide() !== wasWide) { wasWide = wide(); if (wasWide && !["songs", "albums", "playlists", "history"].includes(route.v)) route = { v: "home" }; build(); } });
window.addEventListener("pywebviewready", () => { api = window.pywebview.api; if (MODE === "full") build(); });
async function boot() {
  build();
  if (SERVED) {
    host = location.hostname;
    try {
      const r = await fetch("/local/token", { cache: "no-store" });
      if (r.ok) {
        local = await r.json(); tokens[host] = local.token; serverName = local.name;
        deviceName = PANEL ? (MODE === "mini" ? "Mini player" : "Notch") : local.computer || "This computer";
        build(); start(host); return;
      }
    } catch {}
    start(host); return;   // opened from another computer: pairs with the PIN like a phone
  }
  bridge && bridge.discover(true);
  if (host) start(host); else setTimeout(() => { if (!host) openLink(); }, 1500);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !authed && host && !wantPin) start(host); });
boot();
</script>
