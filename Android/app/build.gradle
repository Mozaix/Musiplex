plugins {
    id "com.android.application"
}

android {
    namespace "com.musiplex.android"
    compileSdk 34

    defaultConfig {
        applicationId "com.musiplex.android"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "2.4"
    }

    // Release signing: a key from the build's secrets when there is one (so updates
    // install over the old app), else the build machine's throwaway debug key.
    def ks = System.getenv("MUSIPLEX_KEYSTORE")
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("MUSIPLEX_KEYSTORE_PASSWORD")
                keyAlias "musiplex"
                keyPassword System.getenv("MUSIPLEX_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The player page is shared with the Windows and Linux app window: Client/musiplex.html.
tasks.register("copyClient", Copy) {
    from(rootProject.file("../Client/musiplex.html"))
    into("src/main/assets")
    rename { "index.html" }
}
preBuild.dependsOn("copyClient")
