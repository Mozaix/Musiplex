<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Musiplex</title>
<style>
/* Same palette as the iPhone app (Shared/UIKit.swift Theme). */
:root{--bg:#07070b;--raised:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--text:#fff;--dim:rgba(255,255,255,.58);
--accent:#a38aff;--accent2:#ff6ea3;--grad:linear-gradient(135deg,var(--accent),var(--accent2));--red:#ff453a;--green:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--text);background:var(--raised);border:0;border-radius:10px;padding:10px 12px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
svg{width:1em;height:1em;fill:currentColor;flex:none}
.hidden{display:none!important}
.dim{color:var(--dim)}
.art{background:linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.05)) center/cover no-repeat;border-radius:6px;flex:none;position:relative;overflow:hidden}
.art.none::after{content:"♪";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.3);font-size:150%}
#main{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px}
header{display:flex;align-items:center;padding:14px 16px}
header h1{font-size:34px;margin:0;flex:1;font-weight:800;letter-spacing:-.5px}
.status{display:flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;max-width:55%}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}.status i.on{background:var(--green)}
.seg{display:flex;margin:0 16px 12px;background:var(--raised);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--dim)}
.seg button.on{background:#636366;color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;margin:0 16px 10px;background:var(--raised);border-radius:10px;padding:0 12px;color:var(--dim)}
.search input{background:none;padding:9px 0}
.row{display:flex;align-items:center;gap:12px;padding:7px 16px;width:100%;text-align:left}
.row:active{background:var(--raised)}
.row .art{width:48px;height:48px}
.row .t{flex:1;min-width:0}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:14px;color:var(--dim)}
.row.cur .title{color:var(--accent)}
.row .wave{display:none;color:var(--accent);margin-right:6px;font-size:11px;letter-spacing:-2px}.row.cur.playing .wave{display:inline}
.row .side{width:32px;height:32px;display:grid;place-items:center;font-size:20px;color:var(--dim)}
.row .side.ok{color:var(--accent)}
.ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.15) 0)}
.ring::after{content:"";display:block;margin:3px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:0 16px}
.tile{text-align:left;min-width:0}.tile .art{width:100%;aspect-ratio:1;border-radius:10px}
.tile div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .n{font-size:14px;font-weight:600;margin-top:6px}.tile .s{font-size:13px;color:var(--dim)}
.cards{display:flex;gap:12px;padding:0 16px 12px}
.card{flex:1;min-width:0;min-height:110px;border-radius:16px;background:var(--grad);color:#000;padding:14px;display:flex;flex-direction:column;text-align:left}
.card svg{font-size:22px;margin-bottom:auto}.card b{font-size:17px}.card small{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:10px;padding:0 16px 10px}
.btn{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;background:var(--raised);border-radius:12px;padding:11px;font-size:15px;font-weight:600}
.btn.primary{background:var(--accent);color:#000}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.empty{padding:50px 24px;text-align:center;color:var(--dim)}
.empty svg{font-size:40px;display:block;margin:0 auto 10px}
.listhead{padding:4px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.listhead .art{width:min(62vw,260px);height:min(62vw,260px);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.listhead h2{margin:14px 0 2px;font-size:22px}.back{display:flex;align-items:center;gap:4px;color:var(--accent);padding:12px 12px 4px;font-size:17px}
.hist{padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hist b{color:var(--accent);margin-right:6px}.hist .ch{font-size:14px;color:var(--dim);margin-top:2px}
#mini{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:8px 10px;
background:rgba(40,40,48,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;z-index:5}
#mini .art{width:42px;height:42px}
#mini .t{flex:1;min-width:0}#mini .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .n{font-size:15px;font-weight:600}#mini .w{font-size:11px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
#mini button{width:40px;height:40px;display:grid;place-items:center;font-size:22px}
#full{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;transform:translateY(100%);
transition:transform .42s cubic-bezier(.2,.9,.25,1);will-change:transform}
#full.open{transform:none}
#full .tint{position:absolute;inset:0;background:linear-gradient(var(--tint,transparent),var(--bg) 85%);opacity:.75;pointer-events:none}
#full .in{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:0 26px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.grab{height:34px;display:grid;place-items:center;width:100%;flex:none}.grab i{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
#bigart{width:100%;aspect-ratio:1;max-width:440px;margin:6px auto 0;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#bigart.paused{transform:scale(.9)}
.np{display:flex;align-items:center;gap:12px;margin-top:24px}
.np .t{flex:1;min-width:0}.np .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ftitle{font-size:22px;font-weight:700}#fartist{color:var(--dim)}
.np>button:not(.t){font-size:24px;width:36px;height:36px;display:grid;place-items:center}
.scrub{margin-top:18px;touch-action:none;padding:8px 0}
.scrub .track{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;transition:height .15s}
.scrub.drag .track{height:10px}
.scrub i{display:block;height:100%;width:0;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ctl button{width:48px;height:48px;display:grid;place-items:center;font-size:22px}
.ctl .big{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;font-size:30px}
.ctl .on{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px;background:rgba(0,0,0,.3);border-radius:999px;margin-top:22px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
.chip.on{background:var(--grad);color:#000}
.vol{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--dim);font-size:14px}
.vol input{padding:0;background:none;accent-color:#fff}
.hint{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-height:88%;overflow-y:auto;background:#1c1c22;border-radius:14px 14px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.open .box{transform:none}
.sheet h3{margin:8px 16px 12px;font-size:20px}
.sheet .pad{padding:0 16px;display:grid;gap:10px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;font-size:16px;text-align:left}
.menu button svg{font-size:20px;color:var(--dim)}.menu .red{color:var(--red)}.menu .red svg{color:var(--red)}
.found{display:grid;gap:8px}
.found button{display:flex;justify-content:space-between;align-items:center;background:var(--raised);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(50,50,58,.95);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style></head>
<body>

<div id="main">
  <header><h1>Musiplex</h1><button class="status" id="status"><i id="dot"></i><span id="linklabel">Searching…</span></button></header>
  <div class="seg" id="seg">
    <button data-tab="songs" class="on">Songs</button><button data-tab="albums">Albums</button><button data-tab="playlists">Playlists</button>
    <button data-tab="offline">Offline</button><button data-tab="history">History</button>
  </div>
  <div class="search" id="searchbox"><svg><use href="#i-search"/></svg><input id="search" placeholder="Search" type="search" autocomplete="off"></div>
  <div id="content"></div>
</div>

<div id="mini" class="hidden">
  <div class="art" id="miniart"></div>
  <div class="t"><div class="n" id="mtitle"></div><div class="w"><svg><use href="#i-speaker"/></svg><span id="mwhere"></span></div></div>
  <button id="mtoggle"></button>
  <button id="mnext" style="font-size:20px"><svg><use href="#i-next"/></svg></button>
</div>

<!-- Full player: expands out of the mini player, like Apple Music. -->
<div id="full">
  <div class="tint"></div>
  <div class="in">
    <button class="grab" id="grab" aria-label="Close player"><i></i></button>
    <div class="art" id="bigart"></div>
    <div class="np">
      <button class="t" id="openqueue" style="text-align:left"><div id="ftitle">—</div><div id="fartist"></div></button>
      <button id="queuebtn"><svg><use href="#i-list"/></svg></button>
      <button id="dlbtn"></button>
    </div>
    <div class="scrub" id="scrub"><div class="track"><i id="fill"></i></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="shuffle" style="font-size:20px"><svg><use href="#i-shuffle"/></svg></button>
      <button id="prev" style="font-size:28px"><svg><use href="#i-prev"/></svg></button>
      <button id="toggle" class="big"></button>
      <button id="next" style="font-size:28px"><svg><use href="#i-next"/></svg></button>
      <button id="repeat" style="font-size:20px;position:relative"><svg><use href="#i-repeat"/></svg><b id="rep1" style="position:absolute;font-size:9px;top:15px;left:21px" class="hidden">1</b></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="vol hidden" id="vol"><svg><use href="#i-speaker"/></svg><input type="range" min="0" max="1" step="0.01" id="volume"><svg style="font-size:20px"><use href="#i-speaker"/></svg></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div class="sheet" id="linksheet"><div class="box">
  <h3>Connection</h3>
  <div class="pad">
    <div class="dim" id="linktext" style="font-size:14px"></div>
    <div class="found" id="found"></div>
    <input id="host" placeholder="Address, e.g. 192.168.1.20 or 100.x.y.z" autocapitalize="off" inputmode="url">
    <input id="pin" class="hidden" placeholder="6‑digit PIN" inputmode="numeric" maxlength="6">
    <button class="btn primary" id="go">Connect</button>
    <div id="msg" class="dim" style="font-size:14px;min-height:18px"></div>
    <button class="btn hidden" id="forget" style="color:var(--red)">Forget this server</button>
  </div>
</div></div>
<div class="sheet" id="queuesheet"><div class="box"><h3>Up Next</h3><div id="queuelist"></div></div></div>
<div class="sheet" id="menusheet"><div class="box"><h3 id="menutitle" style="font-size:17px"></h3><div class="menu" id="menu"></div></div></div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
"use strict";
const $ = id => document.getElementById(id);
const bridge = window.Android || null;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icon = n => `<svg><use href="#i-${n}"/></svg>`;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2200); }

// Made on this phone the first time; only sent to servers you pair with.
let deviceID = store.get("deviceID", null);
if (!deviceID) { deviceID = "android-" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(16).slice(2)); store.set("deviceID", deviceID); }
const deviceName = bridge ? bridge.deviceName() : "Android";
// (?offset=N is only for testing against a server started with --port-offset N.)
const OFF = parseInt(new URLSearchParams(location.search).get("offset") || "0", 10) || 0;
const HTTP = 7860 + OFF, WS = 7861 + OFF;

let host = store.get("host", "");
let tokens = store.get("tokens", {});   // host -> key that server gave this phone
let alts = store.get("alts", {});       // host -> its other addresses (Tailscale)
let ws = null, wsHost = "", authed = false, retry = null, wantPin = false, serverName = store.get("serverName", "");
let catalog = store.get("catalog", { tracks: [], albums: [], playlists: [], history: [] });
let byId = {};
let state = null, stateAt = 0, devices = [];
let tab = "songs", openList = null;
let downloads = {};       // id -> {url, size}
const progress = {};      // id -> 0..1 while downloading
const audio = $("audio");
const linked = () => authed;

function indexCatalog() { byId = {}; (catalog.tracks || []).forEach(t => byId[t.id] = t); }
indexCatalog();
function loadDownloads() {
  downloads = {};
  if (!bridge) return;

      case "shuffle": s.shuffle = !s.shuffle; break;
      case "repeat": s.repeatMode = { off: "all", all: "one", one: "off" }[s.repeatMode] || "off"; break;

    }, { once: true });
  } else if (linked() && audio.readyState > 0) {
    const want = (state.position || 0) + (state.isPlaying ? (Date.now() - stateAt) / 1000 : 0);
    if (Math.abs(audio.currentTime - want) > 2) audio.currentTime = Math.max(0, want);
  }
  audio.volume = Math.min(1, Math.max(0, state.volume ?? 0.8));
  if (state.isPlaying && audio.paused) audio.play().catch(() => {});
  if (!state.isPlaying && !audio.paused) audio.pause();
  bridge && bridge.playing(!!state.isPlaying, t ? t.title : "", t ? t.artist : "");
}
audio.onerror = () => { loaded = ""; };

const deviceIcon = d => d.id === "mac" || d.kind === "mac" ? "laptop" : "phone";
function deviceList() {
  const list = [];
  // A Mac server plays out loud itself; Windows and Linux servers have no speakers.
  if (state && (state.activeDevice === "mac" || !/\((Linux|Windows)\)$/.test(serverName))) list.push({ id: "mac", name: "Mac", kind: "mac" });
  devices.filter(d => d.id !== "mac").forEach(d => list.push(d));
  if (!list.some(d => d.id === deviceID)) list.push({ id: deviceID, name: deviceName, kind: "android" });
  return list;
}
const nameOf = id => id === deviceID ? "this phone" : id === "mac" ? "Mac" : (devices.find(d => d.id === id) || {}).name || "another device";
const setIcon = (el, n) => { el.innerHTML = icon(n); };

function drawPlayer() {
  const id = cur(), t = id && byId[id];
  const audible = linked() ? state && state.activeDevice : deviceID;
  const full = $("full").classList.contains("open");
  $("mini").classList.toggle("hidden", !id || full);
  $("mtitle").textContent = t ? t.title : "";
  $("mwhere").textContent = audible === deviceID ? "Playing on this phone" : `Playing on ${nameOf(audible)}`;
  setArt($("miniart"), id);
  setIcon($("mtoggle"), state && state.isPlaying ? "pause" : "play");
  $("ftitle").textContent = t ? t.title : "—";
  $("fartist").textContent = t ? t.artist : "";
  setArt($("bigart"), id);
  $("bigart").classList.toggle("paused", !(state && state.isPlaying));
  setIcon($("toggle"), state && state.isPlaying ? "pause" : "play");
  $("shuffle").classList.toggle("on", !!(state && state.shuffle));
  $("repeat").classList.toggle("on", !!(state && state.repeatMode !== "off"));
  $("rep1").classList.toggle("hidden", !(state && state.repeatMode === "one"));
  const dl = $("dlbtn"); dl.onclick = null; dl.style.color = "#fff";
  if (t && downloads[t.id]) { dl.innerHTML = icon("check"); dl.style.color = "var(--accent)"; }
  else if (t && progress[t.id] !== undefined) dl.innerHTML = `<div class="ring" style="--p:${Math.max(3, progress[t.id] * 100)}"></div>`;
  else if (t && linked() && bridge) { dl.innerHTML = icon("down"); dl.onclick = () => download(t); }
  else dl.innerHTML = "";
  const chips = $("chips"); chips.innerHTML = "";
  if (linked()) deviceList().forEach(d => {
    const b = document.createElement("button"); b.className = "chip" + (audible === d.id ? " on" : "");
    b.innerHTML = `${icon(deviceIcon(d))}${esc(d.id === deviceID ? "This phone" : d.name)}`;
    b.onclick = () => { if (d.id === deviceID) audio.play().catch(() => {}); command("device", { text: d.id }); };
    chips.appendChild(b);
  });
  chips.classList.toggle("hidden", !linked());
  $("vol").classList.toggle("hidden", !(linked() && audible === "mac"));
  if (state) $("volume").value = state.volume ?? .8;
  $("hint").textContent = !linked() ? "Offline · playing downloads"
    : audible === deviceID ? "Sound is on this phone · other devices mirror, muted"
    : `Sound is on ${nameOf(audible)} · this phone is mirroring, muted`;
  tint(id);
  tick();
}
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
let scrubbing = null;
function tick() {
  const t = byId[cur()], d = t ? t.duration : 0;
  const p = scrubbing ?? Math.min(position(), d || Infinity);
  $("pos").textContent = fmt(p); $("dur").textContent = "-" + fmt(Math.max(0, d - p));
  $("fill").style.width = d ? `${(p / d) * 100}%` : "0";
}
setInterval(() => { if ($("full").classList.contains("open")) tick(); }, 250);

// the player's background takes the artwork's colour (like the iPhone)
let tinted = "";
function tint(id) {
  if (!id || id === tinted || !linked()) return;
  tinted = id;
  get(artURL(id), (status, data) => {
    if (status !== 200 || tinted !== id) return;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = cv.height = 8;
      const g = cv.getContext("2d"); g.drawImage(img, 0, 0, 8, 8);
      let px; try { px = g.getImageData(0, 0, 8, 8).data; } catch { return; }
      let r = 0, gg = 0, b = 0;
      for (let i = 0; i < px.length; i += 4) { r += px[i]; gg += px[i + 1]; b += px[i + 2]; }
      const n = px.length / 4;
      $("full").style.setProperty("--tint", `rgb(${r / n | 0},${gg / n | 0},${b / n | 0})`);
    };
    img.src = data;
  }, !!bridge);
}

// controls
const toggle = e => { e.stopPropagation(); if (here() && state) (state.isPlaying ? audio.pause() : audio.play().catch(() => {})); command("toggle"); };
$("toggle").onclick = toggle; $("mtoggle").onclick = toggle;
$("mnext").onclick = e => { e.stopPropagation(); command("next"); };
$("next").onclick = () => command("next");
$("prev").onclick = () => command("prev");
$("shuffle").onclick = () => command("shuffle");
$("repeat").onclick = () => command("repeat");
$("volume").oninput = e => command("volume", { value: +e.target.value });
(() => {
  const el = $("scrub");
  const at = x => { const t = byId[cur()]; if (!t) return null; const r = el.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * t.duration; };
  el.addEventListener("pointerdown", e => { scrubbing = at(e.clientX); if (scrubbing === null) return; el.classList.add("drag"); el.setPointerCapture(e.pointerId); tick(); });
  el.addEventListener("pointermove", e => { if (scrubbing !== null) { scrubbing = at(e.clientX); tick(); } });
  el.addEventListener("pointerup", () => { if (scrubbing === null) return; const v = scrubbing; scrubbing = null; el.classList.remove("drag"); if (here()) audio.currentTime = v; command("seek", { value: v }); });
})();

// queue
$("queuebtn").onclick = $("openqueue").onclick = () => { drawQueue(); sheet("queuesheet", true); };
function drawQueue() {
  const l = $("queuelist"); l.innerHTML = "";
  if (!state || !state.queue.length) return empty(l, "list", "Nothing queued.");
  state.queue.slice(state.index, state.index + 200).forEach((id, n) => {
    const t = byId[id]; if (!t) return;
    const r = trackRow(t, [], 0);
    r.onclick = () => { command("jump", { index: state.index + n }); sheet("queuesheet", false); };
    l.appendChild(r);
  });
}

function sheet(id, on) { $(id).classList.toggle("open", on); }
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => { if (e.target === s) sheet(s.id, false); }));

// =============== mini player → full player (like Apple Music) ===============
function expand(on) {
  const full = $("full"), big = $("bigart");
  if (on === full.classList.contains("open")) return;
  if (on) {
    if (!cur()) return;
    const from = $("miniart").getBoundingClientRect();
    full.classList.add("open");
    drawPlayer();
    // The artwork grows out of the mini player's thumbnail as the player slides up.
    const to = big.getBoundingClientRect();   // measured before the slide (100% down)
    if (to.width && from.width) {
      const dx = from.left - to.left, dy = from.top - (to.top - window.innerHeight), s = from.width / to.width;
      big.animate([{ transform: `translate(${dx}px,${dy}px) scale(${s})`, borderRadius: "40px" }, { transform: "none", borderRadius: "14px" }],
        { duration: 420, easing: "cubic-bezier(.2,.9,.25,1)" });
    }
  } else {
    full.classList.remove("open"); full.style.transform = "";
    setTimeout(drawPlayer, 380);
  }
}
$("mini").onclick = () => expand(true);
$("grab").onclick = () => expand(false);
(() => {  // swipe down to close
  const f = $("full"); let y0 = null, dy = 0;
  f.addEventListener("touchstart", e => { if (e.target.closest(".scrub,.chips,.vol")) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  f.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 4) { f.style.transition = "none"; f.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  f.addEventListener("touchend", () => { if (y0 === null) return; y0 = null; f.style.transition = ""; if (dy > 140) expand(false); else f.style.transform = ""; });
})();

// =============== go ===============
drawSeg(); render(); setLink(); drawPlayer();
bridge && bridge.discover(true);
if (host) start(host);
else setTimeout(() => { if (!host) openLink(); }, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !authed && host && !wantPin) start(host); });
</script>
</body></html>
